<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SpendWise</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-brand">
                <div class="brand-icon">₹</div>

                <h1>SpendWise</h1>

                <p>
                    Take control of your money,
                    one expense at a time.
                </p>
            </div>


            <div class="auth-content">

                <h2>Welcome Back</h2>

                <p class="auth-subtitle">
                    Login to manage your expenses.
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <p
                        id="loginMessage"
                        class="form-message"
                    ></p>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>


                <p class="auth-switch">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
