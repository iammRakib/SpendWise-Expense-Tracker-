<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | SpendWise</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-brand">

                <div class="brand-icon">₹</div>

                <h1>SpendWise</h1>

                <p>
                    Start building better spending habits today.
                </p>

            </div>


            <div class="auth-content">

                <h2>Create Account</h2>

                <p class="auth-subtitle">
                    Create your account to get started.
                </p>


                <form id="signupForm">

                    <div class="form-group">

                        <label for="signupName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="At least 6 characters"
                            minlength="6"
                            required
                        >

                    </div>


                    <p
                        id="signupMessage"
                        class="form-message"
                    ></p>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>

                </form>


                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
