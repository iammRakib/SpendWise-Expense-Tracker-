<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expenses | SpendWise</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <style>

        .expense-controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-box,
        .filter-box {
            width: 100%;
            padding: 13px 15px;
            background: #07111f;
            color: #ffffff;
            border: 1px solid #263b55;
            border-radius: 9px;
            outline: none;
            font-size: 13px;
        }

        .search-box:focus,
        .filter-box:focus {
            border-color: #3b82f6;
        }

        .expense-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 18px;
            background: #07111f;
            border: 1px solid #1b2d44;
            border-radius: 10px;
        }

        .expense-summary p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .expense-summary h3 {
            font-size: 20px;
        }

        .delete-button {
            border: none;
            background: #3a1c28;
            color: #f87171;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .delete-button:hover {
            background: #572333;
        }

        @media (max-width: 700px) {

            .expense-controls {
                grid-template-columns: 1fr;
            }

            .expense-summary {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

        }

    </style>

</head>


<body>


    <div class="app-container">


        <!-- SIDEBAR -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-brand">

                <div class="brand-icon">
                    ₹
                </div>

                <span>
                    SpendWise
                </span>

            </div>


            <nav class="sidebar-nav">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    <span>⌂</span>
                    Dashboard
                </a>


                <a
                    href="expenses.html"
                    class="nav-link active"
                >
                    <span>₹</span>
                    Expenses
                </a>


                <a
                    href="analytics.html"
                    class="nav-link"
                >
                    <span>▥</span>
                    Analytics
                </a>

            </nav>


            <button
                class="logout-button"
                id="logoutButton"
            >
                <span>↪</span>
                Logout
            </button>

        </aside>



        <!-- MAIN CONTENT -->

        <main class="main-content">


            <!-- TOPBAR -->

            <header class="topbar">

                <button
                    class="menu-button"
                    id="menuButton"
                >
                    ☰
                </button>


                <div>

                    <h1>
                        Expenses
                    </h1>

                    <p>
                        View and manage all your expenses.
                    </p>

                </div>

            </header>



            <!-- EXPENSE SECTION -->

            <section class="dashboard-section">


                <div class="section-header">

                    <div>

                        <h2>
                            All Expenses
                        </h2>

                        <p>
                            Search and manage your transactions.
                        </p>

                    </div>

                </div>



                <!-- SEARCH AND FILTER -->

                <div class="expense-controls">


                    <input
                        type="text"
                        id="searchInput"
                        class="search-box"
                        placeholder="Search expenses..."
                    >


                    <select
                        id="categoryFilter"
                        class="filter-box"
                    >

                        <option value="all">
                            All Categories
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                </div>



                <!-- SUMMARY -->

                <div class="expense-summary">

                    <div>

                        <p>
                            Total Visible Expenses
                        </p>

                        <h3 id="visibleTotal">
                            ₹0.00
                        </h3>

                    </div>


                    <div>

                        <p>
                            Transactions
                        </p>

                        <h3 id="visibleCount">
                            0
                        </h3>

                    </div>

                </div>



                <!-- EXPENSE LIST -->

                <div
                    id="expenseList"
                    class="expense-list"
                >

                    <p class="empty-state">
                        Loading expenses...
                    </p>

                </div>


            </section>


        </main>


    </div>



    <script src="js/expenses.js"></script>

</body>

</html>
